plugins {
    id 'com.android.application'
}

// The sideload key is committed so every CI build can be installed over the previous one.
// For a Play Store release, set SIGNING_* environment variables (e.g. from GitHub secrets).
def keystorePath = System.getenv('SIGNING_STORE_FILE') ?: "${rootDir}/keystore/core-breach-sideload.p12"
def keystorePassword = System.getenv('SIGNING_STORE_PASSWORD') ?: 'corebreach'
def keyAliasName = System.getenv('SIGNING_KEY_ALIAS') ?: 'corebreach'
def keyPass = System.getenv('SIGNING_KEY_PASSWORD') ?: 'corebreach'

android {
    namespace 'com.treyspoonamore.corebreach'
    compileSdk 35

    defaultConfig {
        applicationId 'com.treyspoonamore.corebreach'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "0.1.${System.getenv('VERSION_CODE') ?: '0'}"
    }

    signingConfigs {
        sideload {
            storeFile file(keystorePath)
            storePassword keystorePassword
            keyAlias keyAliasName
            keyPassword keyPass
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
