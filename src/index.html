<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Core Breach</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="res" title="Scrap"><i class="ico scrap"></i><b id="scrap">0</b></div>
    <div class="res" title="Spin"><i class="ico spin"></i><b id="spin">0</b></div>
    <div class="res hidden" id="coresBox" title="Cores"><i class="ico core"></i><b id="cores">0</b></div>
    <div id="wavebox">
      <div class="wave-label">Wave <b id="wave">1</b><span id="best"></span></div>
      <div class="bar"><i id="waveBar"></i></div>
    </div>
    <div id="integrityBox" title="Core integrity">
      <div class="int-label"><i class="ico heart"></i><b id="integrity">20</b></div>
      <div class="bar"><i id="integrityBar"></i></div>
    </div>
  </header>

  <main id="arena">
    <canvas id="cv"></canvas>
    <button id="holdBtn" class="chip" aria-pressed="false">Hold wave</button>
    <div id="overdriveHint" class="chip ghost">Tap core: Overdrive</div>
    <div id="toasts"></div>
    <div id="card" class="hidden"></div>
  </main>

  <div id="goal"></div>

  <nav id="tabs">
    <button data-tab="build" class="active">Build</button>
    <button data-tab="upgrades">Upgrades</button>
    <button data-tab="core" id="coreTabBtn">Core</button>
    <button data-tab="stats">Stats</button>
  </nav>

  <section id="panel">
    <div class="tab" id="tab-build"></div>
    <div class="tab hidden" id="tab-upgrades"></div>
    <div class="tab hidden" id="tab-core"></div>
    <div class="tab hidden" id="tab-stats"></div>
  </section>
</div>
<div id="modal" class="hidden"><div class="modal-box" id="modalBox"></div></div>
<script>/*__SCRIPT__*/</script>
</body>
</html>
