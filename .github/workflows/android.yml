name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, test and bundle the game
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Balance check (time to first Collapse)
        run: npm run sim -- --collapses 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        # ubuntu-latest ships the Android SDK at $ANDROID_HOME; AGP fetches any missing platform.
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk core-breach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: core-breach-apk
          path: core-breach.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" core-breach.apk \
            --title "Core Breach build ${{ github.run_number }}" \
            --notes "Prototype build from ${GITHUB_SHA::7}. Download core-breach.apk on your phone and open it to install." \
            --latest
